name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron:  '0 1 * * *'

permissions:
  contents: read

env:
  BUNDLE_RETRY: 6
  BUNDLE_JOBS: 4

jobs:
  # Docs-only pull requests skip the jobs below; CI Success still runs and reports success,
  # so the required check does not stay pending
  changes:
    uses: ./.github/workflows/ci_changes.yml

  tests:
    # JRuby runs the OSS tests in one process, which takes about 20 minutes on its own
    timeout-minutes: ${{ startsWith(matrix.ruby, 'jruby') && 45 || 30 }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '4.0'
          - '3.4'
          - '3.3'
          - 'jruby-10.0'
        include:
          - ruby: '3.4'
            coverage: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install package dependencies
        run: "[ -e $APT_DEPS ] || sudo apt-get install -y --no-install-recommends $APT_DEPS"

      - name: Remove platform-specific entries for Ruby 4.x
        if: startsWith(matrix.ruby, '4.')
        run: |
          ruby -i -ne 'puts $_ unless /^\s*ffi \(.*-.*\)$/' Gemfile.lock
          ruby -i -e 'prev = nil; $<.each { |line| puts line unless line == prev; prev = line }' Gemfile.lock

      - name: Start Kafka with Docker Compose
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose up -d && break
            echo "Attempt $attempt/5 failed."
            docker compose down -v 2>/dev/null || true
            [ $attempt -lt 5 ] && echo "Retrying in $((attempt * 15))s..." && sleep $((attempt * 15)) || exit 1
          done

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{matrix.ruby}}
          # Gemfile.lock has no java platform, so a frozen cached install fails on JRuby;
          # the Bundle install step below adds the platform
          bundler-cache: ${{ !startsWith(matrix.ruby, 'jruby') }}
          bundler: 'latest'

      - name: Install latest bundler
        run: |
          gem install bundler --no-document
          gem update --system --no-document
          bundle config set without 'tools benchmarks docs'

      - name: Bundle install
        run: |
          bundle config set without development
          bundle install --jobs 4 --retry 3

      - name: Wait for Kafka
        run: bundle exec bin/wait_for_kafka

      - name: Run all tests
        if: ${{ !startsWith(matrix.ruby, 'jruby') }}
        env:
          GITHUB_COVERAGE: ${{matrix.coverage}}
          KARAFKA_PRO_LICENSE_TOKEN: ${{ secrets.KARAFKA_PRO_LICENSE_TOKEN }}
        run: bin/tests_parallel

      # JRuby runs the OSS tests only, in one process and without the Pro license
      - name: Run OSS tests (JRuby)
        if: ${{ startsWith(matrix.ruby, 'jruby') }}
        env:
          SPECS_TYPE: regular
        run: |
          mapfile -t files < <(find test/lib/karafka/web -name '*_test.rb' -not -path '*/pro/*' | sort)
          bundle exec ruby -Itest -Ilib -e 'files = ARGV.dup; require "test_helper"; files.each { |f| require File.expand_path(f) }' "${files[@]}"

      # Coverage thresholds count the Pro tests, which JRuby does not run
      - name: Check coverage
        if: ${{ !startsWith(matrix.ruby, 'jruby') }}
        run: bin/check_coverage

      - name: Check Kafka logs for unexpected warnings
        run: bin/verify_kafka_warnings

      - name: Check test topics naming convention
        run: bin/verify_topics_naming

  rubocop:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      BUNDLE_GEMFILE: Gemfile.lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  assets:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build development assets
        run: ./bin/build_assets

      - name: Build release assets
        run: KARAFKA_RELEASE=true ./bin/build_assets

  integrations:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run integration tests
        run: bin/integrations

  yard-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      BUNDLE_GEMFILE: Gemfile.lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true

      - name: Run yard-lint
        run: bundle exec yard-lint lib/

  herb-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run herb-lint
        run: npx herb-lint

  lostconf:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lostconf
        run: npx lostconf --fail-on-stale

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - rubocop
      - tests
      - integrations
      - assets
      - yard-lint
      - herb-lint
      - lostconf
    steps:
      # Skipped jobs are fine only when the change is docs-only
      - name: Check all jobs passed
        if: |
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        run: exit 1
      - run: echo "All CI checks passed!"
